<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario físico vs SAP · gestión</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="barra">
  <div class="marca">Inventario físico vs SAP
    <small>San Juan · Neuquén · Salta — gestión de identificación y cursos de acción</small></div>
  <nav class="nav" id="nav">
    <button data-vista="inicio" aria-current="page">Trabajar</button>
    <button data-vista="casos">Buscar</button>
    <button data-vista="depurar">Maestro</button>
    <button data-vista="aplicar">Aplicar en SAP</button>
    <button data-vista="informe">Informe</button>
    <button data-vista="ayuda">Cómo se usa</button>
  </nav>
  <div class="der">
    <div class="sync" id="sync"></div>
    <div class="rev" id="cajaRevisor"><span>Revisor</span>
      <input type="text" id="revisor" placeholder="tu nombre"></div>
    <button class="btn chico" id="bActualizar" title="Traer lo que decidieron los demás">↻</button>
    <button class="btn" id="bExcel" title="Descargar el Excel del análisis">Excel ↓</button>
    <button class="btn" id="bPdf" title="Descargar el informe en PDF">PDF ↓</button>
    <button class="btn chico" id="bTema" title="Cambiar tema">◐</button>
  </div>
</header>

<main>
  <!-- Una sola pantalla de trabajo: la hoja de ruta, las etapas y la bandeja
       arriba, y abajo la bandeja de casos o el caso en foco. Antes eran dos
       solapas que hacían la mitad del trabajo cada una. -->
  <section id="v-inicio"></section>
  <section id="v-casos" class="oculto"></section>
  <section id="v-ficha" class="oculto"></section>
  <section id="v-depurar" class="oculto"></section>
  <!-- El resultado del trabajo: qué decisiones se tomaron y qué hay que hacer
       con cada una en SAP, con sus cantidades. -->
  <section id="v-aplicar" class="oculto"></section>
  <section id="v-informe" class="oculto"></section>
  <section id="v-ayuda" class="oculto"></section>
</main>

<script src="almacen.js"></script>
<script src="datos.js"></script>
<script src="xlsxmin.js"></script>
<script src="app.js"></script>
<script src="informe.js"></script>
<script src="exportar.js"></script>
<script>document.addEventListener('DOMContentLoaded', function(){
  /* Primero se resuelve dónde se guardan las decisiones y se traen las que ya
     hay; recién entonces se dibuja, para que nadie vea un tablero en cero que
     un segundo después cambia. */
  Almacen.iniciar(function(){ App.iniciar(); });
});</script>
</body>
</html>
